[package]
name = "arca-janitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Automagik Arca's janitor: a polite, job-based cleanup runner for the trash agents leave behind (build outputs, caches, stale scratch), with space reports, growth and rule-based insights"

[lib]
name = "arca_janitor"
path = "src/lib.rs"

[[bin]]
name = "arca-janitor"
path = "src/main.rs"

# Mount cases need a user namespace; their own harness reports them as ignored where there is none.
[[test]]
name = "mounts"
path = "tests/mounts.rs"
harness = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true

[lints]
workspace = true
