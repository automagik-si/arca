<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
__ARCA_REFRESH__
<title>Arca: GitHub runners</title>
<style>
  :root { color-scheme: light dark; --arca-bg: #f4f4f7; --arca-surface: #fff; --arca-ink: #0c0d11; --arca-muted: #5d6170; --arca-accent: #5b54f9; --arca-warn: #9a5b00; --arca-ok: #1f7a4d; --arca-line: rgba(12, 13, 17, .12); }
  @media (prefers-color-scheme: dark) { :root { --arca-bg: #0b0b0f; --arca-surface: #15161c; --arca-ink: #f1f2f6; --arca-muted: #a4a9b7; --arca-accent: #8b85ff; --arca-warn: #f5b14c; --arca-ok: #5fd39a; --arca-line: rgba(255, 255, 255, .13); } }
  html, body { margin: 0; background: var(--arca-bg); color: var(--arca-ink); font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(44rem, calc(100% - 2rem)); margin: 2rem auto 3rem; box-sizing: border-box; }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
  p, li { color: var(--arca-muted); }
  section { margin: 1rem 0; padding: 1.25rem; border: 1px solid var(--arca-line); border-radius: 1rem; background: var(--arca-surface); }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 650; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .6rem .7rem; border: 1px solid var(--arca-line); border-radius: .6rem; background: var(--arca-bg); color: var(--arca-ink); font: inherit; }
  button { margin-top: 1rem; border: 0; border-radius: .7rem; padding: .75rem 1rem; background: var(--arca-accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
  button.quiet { background: transparent; color: var(--arca-warn); border: 1px solid var(--arca-line); }
  .code { font: 700 2rem/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .15em; margin: .5rem 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9rem; word-break: break-all; }
  .ok { color: var(--arca-ok); }
  .bad { color: var(--arca-warn); }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
  ol.steps { padding-left: 1.25rem; }
  ol.steps li { margin: .35rem 0; }
  a { color: var(--arca-accent); }
  .note { margin: .5rem 0 0; }
</style>
</head>
<body>
<main>
__ARCA_BODY__
</main>
<script>
// A linked node's form: its one button is the owner's approval. The node records the card for what the form says, the
// passkey signs its statement, and the form is posted with the approval; the node checks it itself.
(() => {
  const PREFIX = "arca-kernel-approval/v1\narca-kernel-approve\n";
  const enc = new TextEncoder();
  const b64 = (bytes) => { let text = ""; for (const byte of bytes) text += String.fromCharCode(byte); return btoa(text); };
  const b64url = (bytes) => b64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const fromB64url = (value) => Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const holder = document.getElementById("passkeys");
  let ids = [];
  try { ids = JSON.parse((holder && holder.dataset.ids) || "[]"); } catch { ids = []; }
  const allowCredentials = ids.map((id) => ({ type: "public-key", id: fromB64url(id) }));
  async function approval(statement, challenge) {
    const credential = await navigator.credentials.get({
      publicKey: { challenge, rpId: location.hostname, userVerification: "required", timeout: 60000, allowCredentials },
    });
    if (!credential) throw new Error("No passkey was chosen.");
    const answer = credential.response;
    const proof = {
      alg: answer.signature.byteLength > 72 ? "RS256" : "ES256",
      authenticatorData: b64url(new Uint8Array(answer.authenticatorData)),
      clientDataJSON: b64url(new Uint8Array(answer.clientDataJSON)),
      credentialId: b64url(new Uint8Array(credential.rawId)),
      kind: "webauthn",
      signature: b64url(new Uint8Array(answer.signature)),
      v: 1,
    };
    return b64(enc.encode(statement)) + "." + b64(enc.encode(JSON.stringify(proof)));
  }
  for (const form of document.querySelectorAll("form[data-approve]")) {
    const button = form.querySelector("button[type=submit]");
    const note = form.querySelector(".note");
    const say = (text) => { if (note) note.textContent = text; };
    let card = null;
    form.addEventListener("input", () => { card = null; });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      try {
        if (!card) {
          say("Asking the linked node for the card you approve…");
          const answer = await fetch("/approve/github/prepare", { method: "POST", body: new URLSearchParams(new FormData(form)) });
          const body = await answer.json().catch(() => ({}));
          if (!answer.ok) throw new Error(body.message || ("The page answered " + answer.status + "."));
          const challenge = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(PREFIX + body.statement)));
          card = { plan: body.plan, statement: body.statement, challenge, summary: body.summary || "" };
        }
        say((card.summary ? card.summary + ". " : "") + "Confirm with your passkey…");
        let signed;
        try {
          signed = await approval(card.statement, card.challenge);
        } catch (error) {
          if (error && error.name === "NotAllowedError") {
            say("Press the button again to confirm with your passkey.");
            button.disabled = false;
            return;
          }
          throw error;
        }
        form.elements.plan.value = card.plan;
        form.elements.approval.value = signed;
        say("Approved. Going on…");
        HTMLFormElement.prototype.submit.call(form);
      } catch (error) {
        card = null;
        say((error && error.message) || String(error));
        button.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
