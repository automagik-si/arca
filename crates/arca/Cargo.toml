[package]
name = "arca"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Arca node binary: one-shot watch and metrics reads, token minting, the recording shim and the Arca MCP server, all from one node config file"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-alerts.workspace = true
arca-api.workspace = true
arca-approval.workspace = true
arca-incus.workspace = true
arca-kernel.workspace = true
arca-link.workspace = true
arca-mcp.workspace = true
arca-metrics.workspace = true
arca-providers.workspace = true
arca-reconcile.workspace = true
arca-store.workspace = true
arca-watch.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
iroh-tickets.workspace = true
# The plan tests drive the toy plugin, which only the reconciler's `toy` feature builds.
arca-reconcile = { workspace = true, features = ["toy"] }
base64.workspace = true
ed25519-dalek.workspace = true
rusqlite.workspace = true
# The passkey tests sign with a software P-256 passkey.
p256.workspace = true
sha2.workspace = true

[lints]
workspace = true
